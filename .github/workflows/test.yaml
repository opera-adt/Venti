name: test

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  test:
    # Full suite in the locked pixi `test` environment (conda-forge builds).
    # Not pip: with geepers in the core (ADR-0022) zarr is installed, and with
    # pip-wheel HDF5 builds the threaded netCDF reads of the parallel workflow
    # crash (test_parallel_workers_give_identical_surfaces).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # setuptools_scm needs the tags for the version

      - uses: prefix-dev/setup-pixi@v0.8.10
        with:
          environments: test
          cache: true

      - name: Run tests
        run: pixi run -e test test

  core-only:
    # The operational image installs Venti with no extras (ADR-0020): the
    # calibration core must install, import and pass its own tests without
    # asf_search/dem-stitcher/matplotlib/numba (dask and zarr arrive with
    # geepers, ADR-0022).
    name: Core only (no extras)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install GDAL system libraries
        run: |
          sudo apt-get update -y
          sudo apt-get install -y libgdal-dev gdal-bin
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install GDAL Python bindings matching system libgdal
        run: |
          pip install numpy setuptools wheel
          pip install --no-build-isolation "gdal==$(gdal-config --version)"
      - name: Install the core + test tooling only
        run: |
          pip install -e ".[test]"
          python - <<'PY'
          import importlib.util
          # dask and zarr come with geepers (core since ADR-0022)
          heavy = ["asf_search", "dem_stitcher", "matplotlib", "numba"]
          present = [m for m in heavy if importlib.util.find_spec(m)]
          assert not present, f"core install pulled in {present}"
          PY
      - name: Import the core
        run: |
          python -c "import venti, venti.surface, venti.gnss, venti.io, venti.unwrap, venti.models, venti.staging; from venti.workflow.config import CalibrationOptions; print(venti.__version__)"
      - name: Core tests
        run: pytest -o addopts="" -p no:cacheprovider tests/test_packaging.py tests/test_models_plate.py tests/test_staging_package.py tests/test_unwrap_corrections.py tests/test_surface.py tests/test_config_compat.py
